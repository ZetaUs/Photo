<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片查看器</title>
    <link rel="icon" href="https://github.githubassets.com/favicons/favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #eee;
            margin-bottom: 20px;
            font-weight: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .github-link {
            display: inline-flex;
            align-items: center;
        }
        .github-link svg {
            width: 28px;
            height: 28px;
            fill: #fff;
            transition: opacity 0.2s;
        }
        .github-link:hover svg {
            opacity: 0.7;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .gallery-item {
            aspect-ratio: 1;
            overflow: hidden;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            background: #16213e;
        }
        .gallery-item:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.active {
            display: flex;
        }
        .modal img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 4px;
        }
        .modal-nav {
            position: absolute;
            color: white;
            font-size: 48px;
            cursor: pointer;
            padding: 20px;
            user-select: none;
            transition: opacity 0.2s;
        }
        .modal-nav:hover {
            opacity: 0.7;
        }
        .modal-prev { left: 20px; }
        .modal-next { right: 20px; }
        .modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            cursor: pointer;
        }
        .modal-counter {
            position: absolute;
            bottom: 20px;
            color: white;
            font-size: 16px;
        }
        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 10px;
            }
            .modal-nav { font-size: 32px; padding: 10px; }
        }
    </style>
</head>
<body>
    <h1>图片查看器
        <a href="https://github.com/ZetaUs/Photo" target="_blank" class="github-link" title="View on GitHub">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
            </svg>
        </a>
    </h1>
    <div class="gallery" id="gallery"></div>

    <div class="modal" id="modal">
        <span class="modal-close" id="modalClose">&times;</span>
        <span class="modal-nav modal-prev" id="modalPrev">&#10094;</span>
        <span class="modal-nav modal-next" id="modalNext">&#10095;</span>
        <img id="modalImg" src="" alt="">
        <div class="modal-counter" id="modalCounter"></div>
    </div>

    <script>
        const gallery = document.getElementById('gallery');
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modalImg');
        const modalCounter = document.getElementById('modalCounter');
        let images = [];
        let currentIndex = 0;

        const totalImages = 120;
        for (let i = 1; i <= totalImages; i++) {
            images.push({ thumb: `${i}.jpg`, full: `${i}.jpg` });
        }

        images.forEach((img, index) => {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.innerHTML = `<img src="${img.thumb}" alt="${index + 1}" loading="lazy">`;
            item.addEventListener('click', () => openModal(index));
            gallery.appendChild(item);
        });

        function openModal(index) {
            currentIndex = index;
            updateModal();
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        function updateModal() {
            modalImg.src = images[currentIndex].full;
            modalCounter.textContent = `${currentIndex + 1} / ${images.length}`;
        }

        function showPrev() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            updateModal();
        }

        function showNext() {
            currentIndex = (currentIndex + 1) % images.length;
            updateModal();
        }

        document.getElementById('modalClose').addEventListener('click', closeModal);
        document.getElementById('modalPrev').addEventListener('click', (e) => { e.stopPropagation(); showPrev(); });
        document.getElementById('modalNext').addEventListener('click', (e) => { e.stopPropagation(); showNext(); });
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

        document.addEventListener('keydown', (e) => {
            if (!modal.classList.contains('active')) return;
            if (e.key === 'Escape') closeModal();
            if (e.key === 'ArrowLeft') showPrev();
            if (e.key === 'ArrowRight') showNext();
        });
    </script>
</body>
</html>
